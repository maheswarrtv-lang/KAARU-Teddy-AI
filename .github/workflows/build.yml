name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Assemble project from zips
        run: |
          mkdir -p app_src tmp
          for z in assets lib worker; do
            if [ -f "$z.zip" ]; then
              mkdir -p "tmp/$z"
              unzip -oq "$z.zip" -d "tmp/$z"
              if [ -d "tmp/$z/$z" ]; then
                mv "tmp/$z/$z" "app_src/$z"
              else
                mv "tmp/$z" "app_src/$z"
              fi
            elif [ -d "$z" ]; then
              cp -r "$z" "app_src/$z"
            fi
          done
          cp pubspec.yaml app_src/
          cp analysis_options.yaml app_src/ 2>/dev/null || true
          echo "--- project layout ---"
          find app_src -type f | head -50
          test -f app_src/lib/main.dart
          test -f app_src/assets/kaaru_teddy.glb
      - name: Generate Android files
        working-directory: app_src
        run: |
          cp lib/main.dart /tmp/main.bak
          cp pubspec.yaml /tmp/pub.bak
          flutter create --platforms=android --project-name kaaru_teddy_3d --org com.kaaru .
          cp /tmp/main.bak lib/main.dart
          cp /tmp/pub.bak pubspec.yaml
          rm -f test/widget_test.dart
      - name: Patch manifest
        working-directory: app_src
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" $M || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"|' $M
      - name: Build
        working-directory: app_src
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: kaaru-teddy-apk
          path: app_src/build/app/outputs/flutter-apk/app-release.apk
